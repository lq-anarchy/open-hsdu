; open-hsdu firmware for an ESP32-S3 board (Waveshare ESP32-S3-Zero or similar) wired to a CC1101 module.
; Build:  pio run              Upload: pio run -t upload        (hold BOOT while plugging in, every time: see docs/HARDWARE.md)
; The radio core is shared with the host tests: ../core is pulled in as a library.

[platformio]
default_envs = esp32s3zero

[env:esp32s3zero]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; The devkit board definition assumes 8 MB of flash; the ESP32-S3FH4R2 on the Waveshare ESP32-S3-Zero has 4 MB in the
; package. Without these three lines the image and partition table are for 8 MB and the board will not boot.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
lib_deps = symlink://../core
; The board definition sets ARDUINO_USB_MODE=1 (the chip's built-in USB); we need 0 (TinyUSB), so remove it first.
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
build_flags =
    -std=gnu++17
    -Wall -Wextra
    ; TinyUSB (USB-OTG) mode, NOT the chip's built-in "Hardware CDC and JTAG": in that mode the chip resets
    ; itself when RTS goes high with DTR low and firmware cannot read the control lines at all.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DOPENHSDU_UART_NUM=1
monitor_speed = 115200

; For a dummy load or a cabled bench set-up ONLY, never an antenna: allows the higher PATABLE steps.
[env:esp32s3zero_highpower]
extends = env:esp32s3zero
build_flags =
    ${env:esp32s3zero.build_flags}
    -DOPENHSDU_ALLOW_HIGH_POWER
